# on:
#   push:
#     tags:
#       - v*.*.*

on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main

name: Publishing Kelk to crates.io

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v1
      - uses: actions-rs/cargo@v1

      - name: cargo publish
        run: |
          cargo publish --dry-run -p kelk-allocator
          cargo publish --dry-run -p kelk-env
          cargo publish --dry-run -p kelk-derive
          cargo publish --dry-run -p kelk
          
      - name: docs check
        run: cargo doc --no-deps

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: [check]
    steps:
      - uses: actions/checkout@v1
      - uses: actions-rs/cargo@v1

      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cargo publish --dry-run -p kelk-allocator
          cargo publish --dry-run -p kelk-env
          cargo publish --dry-run -p kelk-derive
          cargo publish --dry-run -p kelk
